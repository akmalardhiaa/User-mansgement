# The portal on the internal server, in production mode.
#
#   podman-compose -f compose.prod.yaml up -d --build
#
# Deliberately a separate file from compose.yaml rather than a profile inside
# it. The two are not variations of one deployment: this one refuses the
# simulated directory, refuses email-to-files, refuses to let anybody in
# without a real LDAP_URL, and sets secure cookies that a browser will not
# return over plain http. Sharing one file would mean one careless flag could
# turn the demo into something that looks like production, or the reverse.
#
# BEFORE THE FIRST RUN, in this order — see MENJALANKAN.md part 2:
#
#   1. .env.production filled in from .env.onprem.example
#   2. the CA certificate present at the path LDAP_CA_CERT_PATH names
#   3. npm run ad:service-check passing, with AD_LDAP_WRITE_ENABLED still false
#
# TLS IS NOT HERE, AND THAT IS NOT AN OVERSIGHT. Session cookies carry
# `secure` in production, so a browser will not send them back over http and
# nobody will stay logged in. Terminate TLS in front of this — IIS, nginx, or
# whatever the company already runs — and point APP_BASE_URL at the https
# address, because every approval link in every email is built from it.

services:
  portal:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    container_name: hc-portal
    image: localhost/hc-portal:prod

    # Bound to loopback because something else terminates TLS in front of it.
    # Publishing this on 0.0.0.0 would put a plain-http portal on the office
    # network, and the login page would still be there.
    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - path: .env.production
        required: true

    environment:
      NODE_ENV: production
      # The worker runs inside this process, and that is only safe because
      # there is exactly ONE of it. The claim lock is per-process: a second
      # instance on the same data would let two workers both believe they hold
      # a job. Do not scale this service. See MENJALANKAN.md, "Yang belum ada".
      WORKER_POLL_SECONDS: "30"
      OUTBOX_POLL_SECONDS: "30"

    volumes:
      # The store, the session file and the outbox. The only state this portal
      # has, and the reason this volume is the thing to back up.
      - ./data:/app/data:z

      # The CA that signed the domain controller's certificate, read-only. The
      # path inside must match LDAP_CA_CERT_PATH in .env.production.
      - ./certs:/app/certs:ro,z

      # Where a folder is made for each new employee. Point the left side at
      # the share HC actually uses; USER_FOLDER_ROOT must name the right side.
      - ./user-folders:/mnt/user-folders:z

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # A compiled start is quick, but the first request still compiles nothing
      # and reads the store; 30s is room for a slow disk, not for a build.
      start_period: 30s
