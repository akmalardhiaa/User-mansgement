name: CI

# Every push and every pull request. The point of this file is that "it all
# passes" stops being something somebody remembered to check locally and starts
# being a condition for merging — an audit is a photograph, a gate is a fence.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run is testing
# code nobody is going to merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime the project is developed against. Node 20 is
          # end-of-life and is not a target; 24 is where this moves next.
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly what the lockfile pins and
      # fails if the lockfile and manifest disagree, which is the whole reason
      # to have a lockfile.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Zero warnings, not zero errors. The project has been kept at zero all
      # along; without --max-warnings that was a habit rather than a rule.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last, because it is the slowest and the least likely to be the thing
      # that broke.
      - name: Build
        run: npm run build
        env:
          # The build must not depend on a real directory or mailbox. Anything
          # that needs them belongs in a deployment step, not here.
          AD_DRIVER: mock
          EMAIL_DRIVER: file

      # The image is not published anywhere; this only proves it still builds.
      # Without it the Dockerfile is guarded by nothing — a dependency that
      # stops installing under Linux, or a file the .dockerignore now excludes,
      # would be discovered by whoever next tried to run the container rather
      # than by the gate.
      #
      # `load: false` keeps the result in the build cache instead of importing
      # it into the runner's daemon: nothing here runs the image, and the import
      # is pure cost.
      #
      # Buildx first, and it is not optional: the runner's default docker driver
      # cannot export a cache, so `cache-to: type=gha` below fails outright
      # without a builder that supports it.
      - uses: docker/setup-buildx-action@v3

      - name: Docker image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
