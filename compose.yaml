# One command to run the portal with Podman:
#
#   podman compose up
#
# Then open http://localhost:3000 and sign in as ayu.prameswari / mock12345.
#
# That one command is meant to be the whole story, so two things below exist to
# keep it true. The source is mounted, so editing a file does not need a rebuild
# — `next dev` inside the container reads the same files you edit. And the
# configuration has a committed layer of demo defaults underneath the local one,
# so a fresh clone with no .env.podman still starts.
#
# The exception is dependencies and the build configuration: a changed
# package.json, lockfile, next.config.ts or tsconfig.json needs
#
#   podman compose up --build
#
# because those are installed or baked into the image, not mounted.

services:
  portal:
    build:
      context: .
      dockerfile: Containerfile
      target: dev
    # Named so `podman compose logs portal` and `podman compose exec portal sh`
    # read the same way whatever the directory is called.
    container_name: hc-portal

    # Bound to 127.0.0.1, not to every interface, and that is the security
    # setting in this file.
    #
    # `"3000:3000"` publishes on 0.0.0.0: anybody on the same office or café
    # network can then open http://<this-machine>:3000 and sign in with the demo
    # accounts, whose passwords are in the README. This portal runs in
    # development mode with no TLS and a simulated directory, so it is meant for
    # the machine it runs on — nothing about it is ready to be a service other
    # people reach.
    #
    # To demonstrate from a phone or another laptop, change this to
    # "0.0.0.0:3000:3000" AND set APP_BASE_URL to that address, because every
    # approval link in every email is built from it. Change it back afterwards.
    #
    # The port number itself stays 3000 on both sides for the same reason:
    # publishing on 8080 without matching APP_BASE_URL produces mail whose
    # buttons point at a port nothing is serving.
    ports:
      - "127.0.0.1:3000:3000"

    # Two layers, and the order is the point. The example file is committed and
    # holds the demo defaults — mock directory, email written to files, nothing
    # secret — so `podman compose up` works on a machine that has just cloned
    # this and has no .env.podman yet. The local file is read second, so every
    # value it sets wins, and it is the only place the SMTP password lives.
    #
    # Secrets arrive at run time, never in a layer: .containerignore keeps .env*
    # out of the build context entirely, so this is the only way in.
    env_file:
      # The same demo defaults `npm run dev` uses. The container runs
      # `next dev`, which reads that file itself — a separate
      # .env.podman.example existed for a while and not one of its keys
      # differed from this one.
      - path: .env.development
        required: true
      # Real secrets — SMTP, the outbox key — go here, read second so every
      # value in it wins. This is the only way in: .containerignore keeps
      # .env* out of the build context entirely.
      - path: .env.podman
        required: false

    # Where the per-employee folders are made, as the CONTAINER sees it. It
    # belongs here rather than in .env.podman because it only means anything
    # together with the mount below: the two have to agree, so they sit
    # together. Remove both lines to switch the feature off.
    environment:
      USER_FOLDER_ROOT: /mnt/user-folders

    volumes:
      # The application's own code, so changing it needs no rebuild: the
      # container compiles the same files you edit.
      #
      # Directories, deliberately — not the whole project. Mounting `.` would
      # put the host's node_modules (Windows binaries) over the image's Linux
      # one, and shadowing it back out takes an anonymous volume that Compose
      # then REUSES on every recreate — so `--build` after adding a dependency
      # would install it into the image and the container would keep running the
      # old modules. Nothing here shadows anything, so that trap does not exist.
      #
      # The cost is that a new top-level directory needs a line here, and that
      # next.config.ts, tsconfig.json and package.json are baked into the image:
      # changing one of those means `--build`.
      - ./src:/app/src
      - ./public:/app/public
      - ./scripts:/app/scripts

      # The folder above this project, where a folder is created for each new
      # employee — see src/lib/lifecycle/userFolder.ts. Written as `..` rather
      # than as an absolute path so it follows the project to another machine:
      # where the project sits in C:\akmalardhia\magang\user management, this is
      # C:\akmalardhia\magang. Point it somewhere else by changing this line and
      # nothing else; the container only ever knows /mnt/user-folders.
      - ..:/mnt/user-folders

      # The state the portal actually owns: the employee roster, server-side
      # sessions, the simulated directory, and the file-driver outbox. Bound to
      # the host so it survives `podman compose down` — and so the accounts
      # already seeded by `npm run mock-ad:roles` are the ones the container
      # sees, rather than an empty directory nobody can log in to.
      - ./data:/app/data

    # A crashed container comes back; a stopped one stays stopped. `always`
    # would restart it after an explicit `podman compose stop`, which is rarely
    # what anybody means.
    restart: unless-stopped

    # Compose reports the container healthy only once the app actually answers,
    # rather than as soon as the process exists. start_period covers the first
    # compile, which Turbopack does on demand and is slower than every request
    # after it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
